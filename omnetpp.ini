[General]
network = uavswarm.Swarm
sim-time-limit = 300s
**.sigmaM = 1.40
**.sigmaR = 1.98
**.sigmaS = 1.40
**.anchorGate = 7.5
**.tau = 4.50
**.cusumKappa = 2.2
**.cusumH = 180
**.persistK = 12
# the per-sample vectors are huge (2.7M samples/run); keep only what you plot
**.motionResidual:vector.vector-recording = false
**.relResidual:vector.vector-recording = false
**.anomaly:vector.vector-recording = false
**.anomalyTargetClean:vector.vector-recording = false

[Config Benign]
# no attack: used for calibration

[Config Jump]
**.cluster[2].uav[3].isSpoofed = true
**.uav[*].attackType = "jump"
**.uav[*].attackStart = 100s
**.uav[*].jumpSize = 20

[Config Ramp]
**.cluster[2].uav[3].isSpoofed = true
**.uav[*].attackType = "ramp"
**.uav[*].attackStart = 100s
**.uav[*].rampRate = 1

[Config Calibration]
extends = Benign
**.anchorGate = 1e9
repeat = 5
seed-set = ${repetition}

[Config DetectBenign]
extends = Benign
repeat = 5
seed-set = ${repetition}

[Config CusumCal]
extends = DetectBenign
**.cusumH = 180
**.persistK = 12

[Config DetectBenignValidate]
extends = DetectBenign
seed-set = ${repetition} + 10

# slow ramps: where CUSUM has to prove itself
[Config SlowRamp]
**.cluster[2].uav[3].isSpoofed = true
**.uav[*].attackType = "ramp"
**.uav[*].attackStart = 100s
**.uav[*].rampRate = ${rate=0.1, 0.2, 0.3, 0.5}
repeat = 3
seed-set = ${repetition}